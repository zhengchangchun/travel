<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>个人设置 · 旅迹</title>
  <link rel="icon" type="image/svg+xml" href="/img/logo.svg" />
  <link rel="stylesheet" href="/css/site.css" />
</head>
<body class="site">
  <div id="headbar"></div>

  <main class="wrap narrow">
    <h1 class="page">个人设置</h1>
    <p class="hint">账号、昵称头像是站点的；默认城市与默认出行方式会带到规划页。</p>
    <div id="main"></div>

    <!-- 手机访问（2026-11-24 用户「手机也能用」）：同一 Wi-Fi 下手机/平板直接打开；
         地址在这儿，怕输错就扫右边那个码（码是页面现画的，不连外部服务） -->
    <div class="card" id="phone-card">
      <h2>手机也能用</h2>
      <p class="hint">
        服务默认管理局域网（启动时只在 0.0.0.0 监听），同一 Wi-Fi 下手机或平板用下面这个地址打开，就是同一份行程。
        手机上得用同一个账号登录；只想本机用，就用 <code>HOST=127.0.0.1</code> 再起服务。
      </p>
      <div class="row phone-row">
        <span class="phone-url" id="phone-url">—</span>
        <button class="btn" type="button" id="phone-copy">复制地址</button>
        <span class="form-msg" id="phone-msg"></span>
      </div>
      <div class="phone-qr" id="phone-qr"></div>
      <p class="hint" id="phone-note"></p>
    </div>

    <!-- 备份：数据库快照 + 分享包 + 实景图 打成一个 zip（data/backups/） -->
    <div class="card" id="backup-card" style="display:none">
      <h2>备份</h2>
      <p class="hint">把数据库（账号 / 行程 / 点位 / 分享记录 / 已收录地点）＋ 分享包 ＋ 实景图打成一个 zip，落在本机 <code>data/backups/</code>。恢复方法写在包里的 README.txt。</p>
      <div class="row">
        <button class="btn primary" type="button" id="bk-now">立即备份</button>
        <span class="form-msg" id="bk-msg"></span>
      </div>
      <div class="list" id="bk-list" style="margin-top:12px"></div>
    </div>
  </main>

  <footer class="site">旅迹 · 账号与设置都存本机 sqlite</footer>

  <script src="/js/site.js"></script>
  <script src="/js/headbar.js"></script>
  <script src="/js/qr.js"></script>
  <script src="/js/settings.js"></script>
</body>
</html>
