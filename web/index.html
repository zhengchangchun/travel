<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>城市旅行规划器 · Travel</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="app">
    <!-- 左栏：全部（浏览用） -->
    <aside id="sidebar" class="col-left">
      <header class="brand">
        <h1>🧭 城市旅行规划器</h1>
        <p class="sub">选城 → 看推荐 → 按分类过滤 → 地图落旗 → 存行程</p>
      </header>

      <section class="card">
        <h2>城市</h2>
        <div class="row">
          <input id="city-input" placeholder="搜索城市，如 杭州" autocomplete="off" />
          <button id="city-search-btn" class="primary">搜索</button>
        </div>
        <div id="city-results" class="result-list"></div>
        <div class="current-city">当前城市：<b id="current-city">—</b></div>
      </section>

      <section class="card">
        <h2>搜索地点</h2>
        <div class="row">
          <input id="poi-input" placeholder="如 西湖 / 火锅" autocomplete="off" />
          <button id="poi-search-btn" class="primary">搜索</button>
        </div>
      </section>

      <section class="card">
        <h2>住宿锚点</h2>
        <div id="base-box" class="base-box">
          <div class="base-name"><b id="base-name">未设定</b></div>
          <div class="base-sub"><span id="base-sub">在住宿结果里点「住这」定锚点</span></div>
          <div class="row">
            <select id="base-radius" title="周边半径">
              <option value="500">500 m</option>
              <option value="1000" selected>1 km</option>
              <option value="2000">2 km</option>
              <option value="5000">5 km</option>
            </select>
            <button id="base-around-btn" class="primary">看周边美食/景点</button>
            <button id="base-clear-btn" class="ghost">清除</button>
          </div>
          <p class="hint">先定住宿，再看它周边的美食与景点（一次查询 ≤4 次调用，其余走缓存）</p>
        </div>
      </section>

      <section class="card">
        <h2>分类过滤</h2>
        <div id="chips" class="chips"></div>
        <p class="hint">默认不选；选中哪个分类就只显示哪个分类；勾「全部」显示所有分类</p>
        <h2 class="sub-head">评分过滤</h2>
        <div id="rating-chips" class="chips rating-chips"></div>
      </section>

      <section class="card">
        <h2>结果 <span id="result-count" class="count">0</span></h2>
        <ul id="result-list" class="poi-list"></ul>
      </section>
    </aside>

    <!-- 中栏：地图 -->
    <main id="map-wrap">
      <div id="map"></div>
      <div id="view-count" class="view-count">当前视野 0 条 · 全城已收录 0 条</div>
      <div id="view-hint" class="view-hint hidden"></div>
      <div id="map-status" class="map-status">地图加载中…</div>
      <div id="map-error" class="map-error hidden"></div>
      <aside id="score-legend" class="score-legend hidden">
        <div class="legend-title">评分由浅入深</div>
        <div class="legend-bar"></div>
        <div class="legend-scale"><span>3.0</span><span>4.0</span><span>5.0</span></div>
        <div class="legend-top"><span class="legend-star">★</span> 满分 5.0</div>
      </aside>
      <aside id="infocard" class="infocard hidden"></aside>
    </main>

    <!-- 右栏：我挑的 -->
    <aside id="right-panel" class="col-right">
      <div class="right-head">
        <h2>我挑的</h2>
        <button id="panel-toggle" class="panel-toggle" title="收起 / 展开右栏"
                aria-controls="right-body" aria-expanded="true">收起 ‹</button>
      </div>
      <div id="right-body" class="right-body">
        <section class="card pin-card">
          <h2>我的选择 <span id="selection-count" class="count">0</span></h2>
          <div class="row">
            <button id="only-selected-btn" class="chip toggle" title="只看我选中的">只看我选中的</button>
            <button id="plan-btn" class="primary" title="规划行程">规划行程</button>
          </div>
          <ul id="selection-list" class="poi-list"></ul>
          <div id="itinerary-panel" class="hidden">
            <div class="row itin-toolbar">
              <button id="itinerary-back" class="ghost">返回</button>
              <button id="itinerary-copy" class="ghost">一键复制</button>
              <button id="itinerary-download" class="ghost">下载 .md</button>
            </div>
            <div class="route-modes" id="route-modes"></div>
            <div class="route-summary">
              <div id="route-totals" class="route-totals"></div>
              <div id="route-progress" class="route-progress"></div>
              <ul id="route-legs" class="route-legs"></ul>
            </div>
            <ol id="itinerary-list" class="poi-list itinerary"></ol>
          </div>
        </section>

        <section class="card">
          <h2>我的行程</h2>
          <div class="row">
            <button id="trip-new-btn" class="ghost">新建行程</button>
            <button id="trip-delete-btn" class="ghost" title="删除当前行程">删除行程</button>
            <span id="trip-name" class="trip-name">未创建</span>
          </div>
          <ul id="trip-list" class="poi-list"></ul>
        </section>
      </div>
    </aside>
  </div>

  <div id="confirm-modal" class="modal-mask hidden">
    <div class="modal-box" role="dialog" aria-modal="true">
      <p id="confirm-modal-msg" class="modal-msg"></p>
      <div class="modal-actions">
        <button id="confirm-cancel" class="ghost">取消</button>
        <button id="confirm-ok" class="danger">确认删除</button>
      </div>
    </div>
  </div>

  <script src="/js/categories.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/selection.js"></script>
  <script src="/js/score-color.js"></script>
  <script src="/js/geo.js"></script>
  <script src="/js/map.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/detail.js"></script>
  <script src="/js/itinerary.js"></script>
  <script src="/js/route.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
